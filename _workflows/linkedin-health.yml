name: linkedin-health

# Daily 08:10 IST: checks the LinkedIn token (this run FAILS, and GitHub emails you,
# when it is invalid or expires within 10 days), renews it if LinkedIn allows that for
# your app, and writes follower and per-post numbers to stats/linkedin.json.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: publisher-linkedin
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
      LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stats
        run: python -m publisher linkedin-stats
      - name: Renew token if possible
        run: python -m publisher linkedin-refresh
      - name: Token check
        id: check
        continue-on-error: true
        run: python -m publisher linkedin-check
      - name: Save stats
        run: |
          git config user.name "gurukul-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add stats state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "linkedin stats: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep 6; done
          exit 1
      - name: Fail loudly if the token needs attention (GitHub then emails you)
        if: steps.check.outcome == 'failure'
        run: |
          echo "LinkedIn token is invalid or expires soon. Follow SETUP-LINKEDIN.md, step 'Renew the token'."
          exit 1
