name: stats

# Daily at 08:00 IST: channel and account stats into stats/latest.json.
# Sundays: also extend the Instagram tokens (they expire after 60 days otherwise).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YT_REFRESH_HI: ${{ secrets.YT_REFRESH_HI }}
      YT_REFRESH_EN: ${{ secrets.YT_REFRESH_EN }}
      IG_TOKEN_HI: ${{ secrets.IG_TOKEN_HI }}
      IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m publisher stats
      - name: Refresh Instagram tokens (Sundays or manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m publisher refresh-ig-tokens
          fi
      - name: Save stats
        run: |
          git config user.name "gurukul-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add stats state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "stats: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
