name: validate

# Checks every queue file whenever the queue changes, so a bad edit is caught
# before the publisher tries to post it.
on:
  push:
    paths: ["queue/**", "config/**", "publisher/**"]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m publisher validate
