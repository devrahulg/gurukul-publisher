name: scout

# Reel scout: outlier reels in our niche + hook breakdowns -> research/reports/<date>.md
# Runs on the 1st and 15th at 08:15 IST (fits the free $5/month Apify credit), on demand (Run workflow), or when research/request.json changes.
on:
  schedule:
    - cron: "45 2 1,15 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["research/request.json"]

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scout
        id: scout
        continue-on-error: true
        run: python -m scout
      - name: Save report
        run: |
          git config user.name "gurukul-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add research
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scout: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: Fail if the scout failed
        if: steps.scout.outcome == 'failure'
        run: exit 1
